{
  "appId": "cn.agensai.universalproxy",
  "productName": "万能代理客户端",
  "directories": {
    "buildResources": "build",
    "output": "release"
  },
  "files": [
    "dist/**/*",
    "package.json"
  ],
  "asar": true,
  "extraResources": [
    { "from": "build/icon.ico", "to": "icon.ico" },
    { "from": "build/icon.png", "to": "icon.png" }
  ],
  "win": {
    "target": ["dir", "portable"],
    "icon": "build/icon.ico"
  },
  "portable": {
    "artifactName": "UniversalProxyClient-${version}-portable.${ext}",
    "unpackDirName": "UniversalProxyClient",
    "requestExecutionLevel": "user"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "shortcutName": "万能代理客户端",
    "artifactName": "UniversalProxyClient-setup-${version}.${ext}"
  }
}
